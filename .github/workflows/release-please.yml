name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for NPM OIDC Trusted Publishing

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      any_release_created: ${{ steps.release.outputs.releases_created == 'true' || steps.release.outputs['packages/cli--release_created'] == 'true' || steps.release.outputs['packages/vscode-stem--release_created'] == 'true' }}
      cli_release_created: ${{ steps.release.outputs['packages/cli--release_created'] }}
      vscode_release_created: ${{ steps.release.outputs['packages/vscode-stem--release_created'] }}
      vscode_tag_name: ${{ steps.release.outputs['packages/vscode-stem--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.any_release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Publish CLI to NPM
        if: ${{ needs.release-please.outputs.cli_release_created == 'true' }}
        run: pnpm --filter @stemdev/cli publish --access public --provenance

      - name: Install vsce
        if: ${{ needs.release-please.outputs.vscode_release_created == 'true' }}
        run: npm install -g @vscode/vsce

      - name: Package VS Code Extension
        if: ${{ needs.release-please.outputs.vscode_release_created == 'true' }}
        run: pnpm --filter vscode-stem exec vsce package

      - name: Upload VSIX to GitHub Release
        if: ${{ needs.release-please.outputs.vscode_release_created == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.release-please.outputs.vscode_tag_name }} packages/vscode-stem/*.vsix
