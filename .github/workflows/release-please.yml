name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for NPM OIDC Trusted Publishing

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

      # The following steps ONLY run if a Release PR was merged
      - name: Checkout repository
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7

      - name: Install pnpm
        if: ${{ steps.release.outputs.release_created }}
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: pnpm install --frozen-lockfile

      - name: Build project
        if: ${{ steps.release.outputs.release_created }}
        run: pnpm build

      - name: Publish CLI to NPM
        if: ${{ steps.release.outputs['packages/cli--release_created'] }}
        run: pnpm --filter @stemdev/cli publish --access public --provenance

      - name: Install vsce
        if: ${{ steps.release.outputs['packages/vscode-stem--release_created'] }}
        run: npm install -g @vscode/vsce

      - name: Package VS Code Extension
        if: ${{ steps.release.outputs['packages/vscode-stem--release_created'] }}
        run: pnpm --filter vscode-stem exec vsce package

      - name: Upload VSIX to GitHub Release
        if: ${{ steps.release.outputs['packages/vscode-stem--release_created'] }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ steps.release.outputs['packages/vscode-stem--tag_name'] }} packages/vscode-stem/*.vsix
