name: Canary Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read
  id-token: write # Required for NPM OIDC Trusted Publishing

jobs:
  canary-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Get Short SHA
        id: short_sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Version CLI (Canary)
        run: npm version 0.0.0-canary.${{ steps.short_sha.outputs.sha }} --no-git-tag-version
        working-directory: packages/cli

      - name: Publish CLI to NPM (Canary)
        run: pnpm --filter @stemdev/cli publish --tag next --access public --provenance --no-git-checks

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package VS Code Extension
        run: pnpm --filter vscode-stem exec vsce package

      - name: Upload VSIX to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vscode-stem-canary
          path: packages/vscode-stem/*.vsix
          retention-days: 7
